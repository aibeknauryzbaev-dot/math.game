<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚡ Өрнек Жарысы 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--neon:#00f5d4;--gold:#FFD700;--c0:#ff6b6b;--c1:#4ecdc4;--c2:#ffe66d;--c3:#a29bfe;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;touch-action: manipulation;}
body{font-family:'Nunito',sans-serif;
  background:radial-gradient(ellipse at 20% 50%,#1a1a2e,#16213e 55%,#0f3460);color:#f0f0f0;}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}

.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:18px;gap:14px;}
.screen.hidden{display:none!important;}

.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:22px;backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(0,0,0,.5);
  padding:26px 28px;width:100%;max-width:540px;}

@keyframes popIn{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.logo{font-family:'Fredoka One',cursive;font-size:2.4rem;letter-spacing:2px;
  background:linear-gradient(90deg,var(--neon),var(--gold),#f72585);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
.sub{color:rgba(255,255,255,.45);font-size:.9rem;font-weight:700;text-align:center;letter-spacing:1px;}

/* SETUP */
.cnt-row{display:flex;gap:10px;justify-content:center;margin:4px 0 14px;}
.cnt-btn{flex:1;max-width:90px;padding:12px 0;border:2px solid rgba(255,255,255,.15);
  border-radius:13px;background:transparent;color:rgba(255,255,255,.45);
  font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;transition:all .2s;}
.cnt-btn.on{background:rgba(0,245,212,.15);border-color:var(--neon);color:var(--neon);}
.player-rows{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.p-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);
  border-radius:13px;padding:9px 13px;border-left:5px solid #ccc;}
.p-inp{flex:1;background:transparent;border:none;outline:none;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:1.1rem;color:#f0f0f0;}
.p-inp::placeholder{color:rgba(255,255,255,.28);}
.diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.d-btn{flex:1;padding:10px 0;border:2px solid rgba(255,255,255,.15);border-radius:12px;
  background:transparent;color:rgba(255,255,255,.45);
  font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;transition:all .2s;}
.d-btn.on{background:rgba(247,37,133,.15);border-color:#f72585;color:#f72585;}
.go-btn{width:100%;padding:18px;border:none;border-radius:15px;
  background:linear-gradient(135deg,#00f5d4,#0077b6);color:#0d1117;
  font-family:'Fredoka One',cursive;font-size:1.5rem;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,245,212,.32);transition:transform .1s;}

/* GAME SCREEN */
#gameScreen{flex-direction:column;padding:0;justify-content:flex-start;}
.top-bar{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.global-timer{font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--gold);}

.cols{flex:1;width:100%;display:flex;overflow:hidden;}
.col{flex:1;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.1);
  position:relative;overflow:hidden;}
.col:last-child{border-right:none;}

.col-head{padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  border-bottom:3px solid transparent;flex-shrink:0;}
.col-av{font-size:1.4rem;}
.col-nm{font-family:'Fredoka One',cursive;font-size:.9rem;
  white-space:nowrap;max-width: 100%; overflow:hidden;}
.col-sc{font-family:'Fredoka One',cursive;font-size:.85rem;
  background:rgba(255,255,255,.1);border-radius:20px;padding:2px 10px;}

.col-body{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 6px;gap:8px;overflow:hidden;}

/* Expression Area - Larger Text */
.expr-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:12px 6px;width:100%;text-align:center;flex-shrink:0;}
.expr-txt{font-family:'Fredoka One',cursive;font-size:1.8rem;line-height:1.1;color:#fff;}
.expr-txt .vr{color:var(--neon);animation:bounce 1.2s ease infinite;display:inline-block;}
.expr-hint{font-size:.75rem;font-weight:900;color:rgba(255,255,255,.45);margin-top:4px;text-transform:uppercase;}

/* Answer Area - Larger Text */
.ans-disp{width:100%;padding:10px;text-align:center;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);
  border-radius:12px;font-family:'Fredoka One',cursive;font-size:1.8rem;
  color:#f0f0f0;min-height:50px;letter-spacing:3px;
  transition:all .2s;flex-shrink:0;}
.ans-disp.ok{border-color:#66BB6A;background:rgba(102,187,106,.22);}
.ans-disp.no{border-color:#EF5350;background:rgba(239,83,80,.18);animation:shake .3s;}
.ans-disp.empty{color:rgba(255,255,255,.15);}

/* Compact & Integrated Numpad */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;flex: 1; min-height: 0;}
.np-btn{border:none;border-radius:10px;font-family:'Fredoka One',cursive;font-size:1.2rem;
  cursor:pointer;transition:transform .08s, background .1s;
  background:rgba(255,255,255,.1);color:#f0f0f0;
  border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  user-select:none; height: 100%;}
.np-btn:active{transform:scale(.92);background:rgba(255,255,255,.2);}
.np-btn.del{background:rgba(255,100,100,.15);color:#ff9999;}
.np-btn.sub{background:linear-gradient(135deg, #00f5d4, #00b4d8); color:#0d1117; 
  font-size: 1.1rem; grid-column: span 1;}

.fb{font-family:'Fredoka One',cursive;font-size:.85rem;min-height:20px; text-align:center;flex-shrink:0;}
.fb.ok{color:#66BB6A;}.fb.no{color:#EF5350;}

/* Progress & Timer */
.timer-row{display:flex;align-items:center;gap:8px;width:100%;justify-content: center;}
.ring-wrap{position:relative;width:40px;height:40px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4;}
.ring-fg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s;}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:.9rem;}

.col-dots{display:flex;gap:3px;flex-wrap:nowrap;justify-content:center;overflow: hidden;}
.cd{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.15);transition:all .2s;}
.cd.ok{background:#66BB6A;border-color:#388E3C;}
.cd.no{background:#EF5350;border-color:#BF360C;}
.cd.cur{background:var(--gold);border-color:#F9A825;transform:scale(1.25);box-shadow: 0 0 8px var(--gold);}

/* Winner display */
.col-winner{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:30;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .4s;}
.col-winner.show{opacity:1;pointer-events:auto;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- SETUP -->
<div class="screen" id="setupScreen">
  <div class="logo">⚡ Өрнек Жарысы</div>
  <p class="sub">ТЕЗІРЕК ЕСЕПТЕ • ЖЕҢІСКЕ ЖЕТ</p>
  <div class="glass" style="animation:popIn .5s cubic-bezier(.34,1.56,.64,1)">
    <p style="font-weight:700;color:rgba(255,255,255,.42);font-size:.8rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Ойыншылар саны</p>
    <div class="cnt-row">
      <button class="cnt-btn" onclick="setCnt(2,this)">2</button>
      <button class="cnt-btn on" onclick="setCnt(3,this)">3</button>
      <button class="cnt-btn" onclick="setCnt(4,this)">4</button>
    </div>
    <div class="player-rows" id="pRows"></div>
    <p style="font-weight:700;color:rgba(255,255,255,.42);font-size:.8rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Қиындық</p>
    <div class="diff-row">
      <button class="d-btn on" onclick="setDiff('easy',this)">🌱 Оңай</button>
      <button class="d-btn" onclick="setDiff('medium',this)">🔥 Орта</button>
      <button class="d-btn" onclick="setDiff('hard',this)">🚀 Қиын</button>
    </div>
    <button class="go-btn" onclick="initGame()">🏁 ЖАРЫСТЫ БАСТАУ</button>
  </div>
</div>

<!-- COUNTDOWN -->
<div class="screen hidden" id="cdScreen" style="background:rgba(0,0,0,0.95)">
  <div id="cdNum" style="font-family:'Fredoka One';font-size:10rem;color:var(--neon);text-shadow:0 0 30px var(--neon)">3</div>
</div>

<!-- GAME -->
<div class="screen hidden" id="gameScreen">
  <div class="top-bar">
    <div style="font-family:'Fredoka One';font-size:1.1rem;color:var(--neon)">⚡ RACE</div>
    <div class="global-timer">⏱ <span id="globalClock">0:00</span></div>
    <div style="font-family:'Fredoka One';font-size:.8rem;color:rgba(255,255,255,.3)">10 СҰРАҚ</div>
  </div>
  <div class="cols" id="colsWrap"></div>
</div>

<!-- RESULT -->
<div class="screen hidden" id="resultScreen" style="background:rgba(10,10,20,0.98)">
  <div class="logo">🏁 НӘТИЖЕЛЕР</div>
  <div id="podium" style="display:flex;gap:20px;align-items:flex-end;margin:30px 0"></div>
  <div id="lbList" style="width:100%;max-width:500px"></div>
  <button class="go-btn" onclick="location.reload()" style="max-width:300px;margin-top:20px">ҚАЙТАДАН</button>
</div>

<script>
const QDB={
  easy:[
    {e:'a + 5',h:'a=7',ans:12},{e:'a − 4',h:'a=10',ans:6},{e:'2 · a',h:'a=6',ans:12},{e:'a + a',h:'a=8',ans:16},
    {e:'3 · a',h:'a=4',ans:12},{e:'12 − a',h:'a=5',ans:7},{e:'a + 9',h:'a=3',ans:12},{e:'a · 4',h:'a=2',ans:8},
    {e:'20 − a',h:'a=11',ans:9},{e:'a + 7',h:'a=6',ans:13},{e:'a · a',h:'a=4',ans:16},{e:'15 + a',h:'a=5',ans:20},
    {e:'a − 8',h:'a=15',ans:7},{e:'a · 5',h:'a=3',ans:15},{e:'a + 12',h:'a=8',ans:20},{e:'18 − a',h:'a=9',ans:9}
  ],
  medium:[
    {e:'2a + 3',h:'a=5',ans:13},{e:'(a+1)·2',h:'a=6',ans:14},{e:'a² + 1',h:'a=4',ans:17},{e:'3a − 5',h:'a=4',ans:7},
    {e:'10 + 2a',h:'a=3',ans:16},{e:'(a−2)·4',h:'a=5',ans:12},{e:'a(a+1)',h:'a=3',ans:12},{e:'20 − 3a',h:'a=4',ans:8},
    {e:'a² − a',h:'a=5',ans:20},{e:'(a+3)·3',h:'a=4',ans:21},{e:'5a + a',h:'a=3',ans:18},{e:'2(a+5)',h:'a=4',ans:18}
  ],
  hard:[
    {e:'a² + 2a',h:'a=3',ans:15},{e:'(a+2)²',h:'a=3',ans:25},{e:'2a² − 4',h:'a=3',ans:14},{e:'a(2a−1)',h:'a=4',ans:28},
    {e:'a³ + 2',h:'a=2',ans:10},{e:'(a−1)(a+1)',h:'a=5',ans:24},{e:'3a² + a',h:'a=2',ans:14},{e:'(2a+1)²',h:'a=2',ans:25},
    {e:'a² + a + 1',h:'a=4',ans:21},{e:'2a(a−2)',h:'a=5',ans:30},{e:'a³ − a²',h:'a=3',ans:18},{e:'5a² / 2',h:'a=2',ans:10}
  ]
};

const COLORS=['#ff6b6b','#4ecdc4','#ffe66d','#a29bfe'];
const AVATARS=['🦁','🦊','🐺','🐯'];
let diff='easy',cnt=3,players=[],globalStart=0,globalTick=null,finished=0;

/* SETUP FUNCTIONS */
setCnt(3,null);
function setCnt(n,btn){
  cnt=n;
  if(btn){
    document.querySelectorAll('.cnt-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }
  buildPRows();
}
function setDiff(d,btn){
  diff=d;
  document.querySelectorAll('.d-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function buildPRows(){
  const c=document.getElementById('pRows');c.innerHTML='';
  for(let i=0;i<cnt;i++){
    c.innerHTML+=`<div class="p-row" style="border-color:${COLORS[i]}">
      <span>${AVATARS[i]}</span>
      <input class="p-inp" id="pi${i}" placeholder="${i+1}-ойыншы" maxlength="10">
    </div>`;
  }
}

/* GAME CORE */
function initGame(){
  players=[];
  const pool=shuffle([...QDB[diff]]);
  for(let i=0;i<cnt;i++){
    const nm=document.getElementById('pi'+i).value || `Ойыншы ${i+1}`;
    players.push({
      name:nm,color:COLORS[i],avatar:AVATARS[i],
      questions:pool.slice(i*4, (i+4)*4).concat(shuffle([...QDB[diff]])).slice(0,10),
      score:0,idx:0,correct:0,done:false,val:'',timeLeft:15,locked:false
    });
  }
  document.getElementById('setupScreen').classList.add('hidden');
  countdown();
}

function countdown(){
  const scr=document.getElementById('cdScreen');
  const num=document.getElementById('cdNum');
  scr.classList.remove('hidden');
  let n=3;
  const iv=setInterval(()=>{
    n--;
    if(n>0) num.textContent=n;
    else if(n===0) { num.textContent='ЖЕТ!'; num.style.color='var(--gold)'; }
    else { clearInterval(iv); scr.classList.add('hidden'); startRace(); }
  },800);
}

function startRace(){
  buildCols();
  document.getElementById('gameScreen').classList.remove('hidden');
  globalStart=Date.now();
  globalTick=setInterval(updateGlobalClock,500);
  players.forEach((_,i)=>nextQuestion(i));
}

function buildCols(){
  const wrap=document.getElementById('colsWrap');wrap.innerHTML='';
  players.forEach((p,i)=>{
    const col=document.createElement('div');
    col.className='col';
    col.innerHTML=`
      <div class="col-head" style="border-bottom-color:${p.color}">
        <div class="col-av">${p.avatar}</div>
        <div class="col-nm" style="color:${p.color}">${p.name}</div>
        <div class="col-sc" id="sc${i}">0⭐</div>
      </div>
      <div class="col-body">
        <div class="timer-row">
           <div class="ring-wrap">
            <svg width="40" height="40"><circle class="ring-bg" cx="20" cy="20" r="16"/><circle class="ring-fg" id="rfg${i}" cx="20" cy="20" r="16" stroke="${p.color}" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg>
            <div class="ring-num" id="rn${i}">15</div>
          </div>
          <div class="col-dots" id="dots${i}"></div>
        </div>
        <div class="expr-box">
          <div class="expr-txt" id="ex${i}"></div>
          <div class="expr-hint" id="ht${i}"></div>
        </div>
        <div class="ans-disp empty" id="dp${i}">?</div>
        <div class="fb" id="fb${i}"></div>
        <div class="numpad">
          ${[7,8,9,4,5,6,1,2,3].map(n=>`<button class="np-btn" onclick="press(${i},${n})">${n}</button>`).join('')}
          <button class="np-btn del" onclick="del(${i})">⌫</button>
          <button class="np-btn" onclick="press(${i},0)">0</button>
          <button class="np-btn sub" onclick="submit(${i})">✓</button>
        </div>
      </div>
      <div class="col-winner" id="win${i}">
        <div style="font-size:3rem">👑</div>
        <div style="font-family:'Fredoka One';color:var(--gold);text-align:center" id="wintxt${i}"></div>
      </div>`;
    wrap.appendChild(col);
    const dots=document.getElementById('dots'+i);
    for(let d=0;d<10;d++) dots.innerHTML+=`<div class="cd" id="d${i}_${d}"></div>`;
  });
}

function nextQuestion(pi){
  const p=players[pi];
  if(p.idx>=10){ finish(pi); return; }
  p.val=''; p.locked=false; p.timeLeft=15;
  document.getElementById('dp'+pi).textContent='?';
  document.getElementById('dp'+pi).className='ans-disp empty';
  document.getElementById('fb'+pi).textContent='';
  document.getElementById('ex'+pi).innerHTML=p.questions[p.idx].e.replace('a', '<span class="vr">a</span>');
  document.getElementById('ht'+pi).textContent=p.questions[p.idx].h + ' болса...';
  document.getElementById(`d${pi}_${p.idx}`).classList.add('cur');
  
  clearInterval(p.timer);
  p.timer=setInterval(()=>{
    p.timeLeft--;
    updateTimerUI(pi);
    if(p.timeLeft<=0){ clearInterval(p.timer); submit(pi, true); }
  },1000);
}

function updateTimerUI(pi){
  const p=players[pi];
  const offset=100.5 * (1 - p.timeLeft/15);
  document.getElementById('rfg'+pi).style.strokeDashoffset=offset;
  document.getElementById('rn'+pi).textContent=p.timeLeft;
}

function press(pi, n){
  if(players[pi].locked) return;
  if(players[pi].val.length<4){
    players[pi].val += n;
    document.getElementById('dp'+pi).textContent=players[pi].val;
    document.getElementById('dp'+pi).classList.remove('empty');
  }
}
function del(pi){
  if(players[pi].locked) return;
  players[pi].val = players[pi].val.slice(0, -1);
  const dp=document.getElementById('dp'+pi);
  dp.textContent=players[pi].val || '?';
  if(!players[pi].val) dp.classList.add('empty');
}

function submit(pi, isTimeUp=false){
  const p=players[pi];
  if(p.locked || (!p.val && !isTimeUp)) return;
  p.locked=true;
  clearInterval(p.timer);
  
  const correctAns = p.questions[p.idx].ans;
  const userAns = parseInt(p.val);
  const isOk = !isTimeUp && (userAns === correctAns);
  
  const dp=document.getElementById('dp'+pi);
  dp.className='ans-disp ' + (isOk?'ok':'no');
  dp.textContent = isTimeUp ? '⏰' : (p.val || '?');
  
  const fb=document.getElementById('fb'+pi);
  fb.textContent = isOk ? 'ЖАРАЙСЫҢ! +10' : ('ҚАТЕ: ' + correctAns);
  fb.className='fb ' + (isOk?'ok':'no');

  if(isOk){ p.score += 10; p.correct++; }
  document.getElementById('sc'+pi).textContent=p.score+'⭐';
  document.getElementById(`d${pi}_${p.idx}`).className='cd '+(isOk?'ok':'no');

  setTimeout(()=>{
    p.idx++;
    nextQuestion(pi);
  }, 1000);
}

function finish(pi){
  const p=players[pi];
  p.done=true;
  finished++;
  const winbox=document.getElementById('win'+pi);
  winbox.classList.add('show');
  document.getElementById('wintxt'+pi).innerHTML=`${finished}-ШІ ОРЫН!<br>${p.score} ҰПАЙ`;
  if(finished===players.length) showFinalResults();
}

function updateGlobalClock(){
  const s=Math.floor((Date.now()-globalStart)/1000);
  const m=Math.floor(s/60), sec=s%60;
  document.getElementById('globalClock').textContent=`${m}:${sec<10?'0':''}${sec}`;
}

function showFinalResults(){
  clearInterval(globalTick);
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  const list=document.getElementById('lbList');
  list.innerHTML='';
  sorted.forEach((p,i)=>{
    list.innerHTML+=`<div style="display:flex;align-items:center;padding:15px;background:rgba(255,255,255,0.05);margin:5px;border-radius:12px;border-left:5px solid ${p.color}">
      <span style="font-size:1.5rem;margin-right:15px">${i+1}</span>
      <span style="font-size:1.5rem">${p.avatar}</span>
      <div style="flex:1;margin-left:10px;font-weight:bold">${p.name}</div>
      <div style="font-family:'Fredoka One';font-size:1.3rem">${p.score}⭐</div>
    </div>`;
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// Stars BG
const starWrap=document.getElementById('stars');
for(let i=0;i<50;i++){
  const s=document.createElement('div');
  s.className='star';
  const size=Math.random()*3;
  s.style.width=size+'px'; s.style.height=size+'px';
  s.style.top=Math.random()*100+'%'; s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(Math.random()*3+2)+'s';
  starWrap.appendChild(s);
}
</script>
